<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff868a, #cfbafc, #ffc4b4);
            animation: bgmove 12s ease infinite;
            background-size: 300% 300%;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bgmove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            font-family: "Pacifico", cursive;
            color: white;
            font-size: 40px;
            text-align: center;
            letter-spacing: 2px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
        }

        .box {
            background-color: white;
            height: 340px;
            width: 280px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgb(198, 96, 113);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .box:hover {
            transform: scale(1.1);
        }

        .cake {
            background-color: #edb371;
            height: 120px;
            width: 200px;
            margin-top: 160px;
            border-radius: 12px;
            position: absolute;
            text-align: center;
            font-size: 50px;
            box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.08);
        }

        .icing {
            background-color: rgb(245, 190, 199);
            height: 20px;
            width: 200px;
            margin-top: 150px;
            z-index: 1;
            border-radius: 15px;
            position: absolute;
        }

        .candle {
            height: 80px;
            width: 15px;
            background-color: plum;
            margin-top: 100px;
            border-radius: 40px;
            position: absolute;
        }

        .flame-wrapper {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .flame {
            width: 18px;
            height: 18px;
            background: orange;
            border-radius: 50% 50% 50% 0;
            box-shadow: 0 0 10px orange, 0 0 25px rgba(255, 165, 0, 0.8);
            animation: flicker 0.6s infinite alternate, glow 1s infinite alternate;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 10px orange, 0 0 20px orange;
            }

            100% {
                box-shadow: 0 0 20px orange, 0 0 40px orange;
            }
        }

        @keyframes flicker {
            0% {
                transform: translateY(0px) scale(1) rotate(-2deg);
            }

            50% {
                transform: translateY(-2px) scale(1.05) rotate(2deg);
            }

            100% {
                transform: translateY(0px) scale(0.98) rotate(-1deg);
            }
        }

        .next-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            color: #333;
            padding: 12px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-family: sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            z-index: 999;
        }

        .next-btn:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>
    <h1><u>For Someone Who Means A Lot</u></h1>
    <div class="card">
        <div class="box">
            <div class="flame-wrapper">
                <div class="flame"> </div>
            </div>
            <div class="candle"></div>
            <div class="icing"></div>
            <div class="cake">🎀</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        setInterval(() => {

            confetti({
                particleCount: 3,
                angle: 160,
                spread: 100,
                startVelocity: 10,
                gravity: 0.6,
                scalar: 0.8,
                ticks: 200,
                drift: -0.2,
                origin: { x: 1, y: 0.5 },
                colors: [
                    '#5e548e',
                    '#9f86c0',
                    '#be95c4',
                    '#6d6875',
                    '#b5838d'
                ]
            });

            confetti({
                particleCount: 3,
                angle: 20,
                spread: 100,
                startVelocity: 10,
                gravity: 0.6,
                scalar: 0.8,
                ticks: 200,
                drift: 0.2,
                origin: { x: 0, y: 0.5 },
                colors: [
                    '#5e548e',
                    '#9f86c0',
                    '#be95c4',
                    '#6d6875',
                    '#b5838d'
                ]
            });

        }, 400);
    </script>
    <a href="webpage2.html" class="next-btn">Next 🌙</a>
</body>

</html>
