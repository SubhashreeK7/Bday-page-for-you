<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(135deg, #110157, #005dba);
            background-size: 300% 300%;
            animation: bgmove 12s ease infinite;
            animation: fadeIn 0.8s ease;

        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bgmove {
            0% {
                background-position: 0% 50%;

            }

            50% {
                background-position: 50% 100%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .diary {
            justify-content: center;
            display: flex;
            text-align: center;
        }

        .cover {
            background-color: rgb(196, 27, 27);
            background-image:
                linear-gradient(145deg, #b31217, #e52d27),
                url("https://www.transparenttextures.com/patterns/old-wall.png");
            height: 250px;
            width: 190px;
            border-left: 10px solid rgb(245, 170, 95);
            margin-top: 70px;
            box-shadow:
                -10px 10px 20px rgba(0, 0, 0, 0.4),
                inset 3px 0 10px rgba(255, 255, 255, 0.2);

            border-radius: 6px;
            transition: transform 0.3s ease;
        }

        .cover:hover {
            transform: translateY(-10px) rotate(-2deg);
        }

        .cover h2 {
            color: #fff;
            font-family: serif;
            margin-top: 100px;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .note {
            position: absolute;
            width: 200px;
            padding: 15px;
            background: #fff8a6;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            font-size: 14px;
            line-height: 1.4;
            animation: drop 0.4s ease;
            transition: transform 0.2s ease;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.03));
        }

        .note:hover {
            transform: scale(1.05) rotate(0deg);
        }

        @keyframes drop {
            from {
                transform: translateY(-80px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #board {
            overflow-y: auto;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .next-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            color: #333;
            padding: 12px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-family: sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            z-index: 999;
        }

        .next-btn:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>
    <div class="diary">
        <div class="cover">
            <h2>MEOMORIES</h2>
        </div>
    </div>
    <div id="board"></div>
    <script>
        let count = 0;

        const memories = [
            "when he first DM’d pretending to be my maths teacher… and honestly, the acting was SO bad 😭🎀",
            "we had so many arguments over random topics… didn’t talk for weeks… but still somehow stayed friends 🌙",
            "that New Year night… when I wished him at exactly 12am and he got so happy… like it meant everything ✨",
            "I didn’t even know I could make someone that happy just by being there 💭",
            "when he showed me that interview post… I was SO happy for him 🌸",
            "and I was the first person he told that big news to… it made me feel really special 🕯️",
            "I wish this friendship stays the same forever… 💌"
        ];

        document.body.addEventListener("click", (e) => {
            if (count >= memories.length) {
                let end = document.createElement("div");
                end.classList.add("note");
                end.innerText = "end of memories… 🌙";
                document.getElementById("board").appendChild(end);
                return;
            }

            let note = document.createElement("div");
            note.classList.add("note");

            note.innerText = memories[count];

            note.style.left = Math.random() * (window.innerWidth - 220) + "px";
            note.style.top = Math.random() * (window.innerHeight - 120) + "px";
            note.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;

            document.getElementById("board").appendChild(note);

            count++;
        });
    </script>
    <a href="webpage3.html" class="next-btn">Open Gift 🎁</a>
</body>

</html>
